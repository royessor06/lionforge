<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="600" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FBBF24" text-anchor="middle">LionForge</text>
  
  <!-- Subtitle -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="36" fill="#F3F4F6" text-anchor="middle">Solutions digitales sur mesure</text>
  
  <!-- Lion emoji -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="120" text-anchor="middle">🦁</text>
  
  <!-- Tagline -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="28" fill="#94A3B8" text-anchor="middle">Développement web &amp; mobile - Agence Bénin</text>
</svg>
